name: CI smoke

on: pull_request

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip --disable-pip-version-check install pytest==8.4.2
      - name: Run developer-tool smoke tests
        run: python -m pytest -q tests/test_code_index.py tests/test_diff_scope_summary.py
